version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "Eetezadi"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Pin PostgreSQL to v18 major version
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # ClickHouse ships monthly and its data directory cannot be downgraded,
      # so every bump is a one-way door. Plausible only tests against 25.11
      # (upstream compose still pins 24.12), and we already run ahead of that.
      # Hold the version and upgrade deliberately with a backup instead.
      # See the "Upgrading ClickHouse" section in README.md.
      - dependency-name: "clickhouse/clickhouse-server"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
